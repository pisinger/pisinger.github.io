<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Two outbound paths, two different boundaries</title>
  <desc id="desc">Tool traffic passes through Squid with a destination allowlist. Model requests pass through an API proxy that holds the real Ollama key. Direct internet traffic from the agent is blocked.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7890aa"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#31a779"/></marker>
    <style>
      .bg{fill:#101923}.box{fill:#172532;stroke:#33485b;stroke-width:2}.tool{stroke:#42a5f5}.model{stroke:#a78bfa}.dest{fill:#1c302d;stroke:#31a779;stroke-width:2}.title{font:700 22px system-ui,sans-serif;fill:#f2f6fa}.label{font:600 17px system-ui,sans-serif;fill:#e6edf3}.small{font:14px system-ui,sans-serif;fill:#aebdca}.toolLine{stroke:#42a5f5;stroke-width:4;fill:none;marker-end:url(#arrow)}.modelLine{stroke:#31a779;stroke-width:4;fill:none;marker-end:url(#greenArrow)}.blocked{stroke:#ef6a6a;stroke-width:3;stroke-dasharray:8 7;fill:none}.badge{font:700 13px system-ui,sans-serif;letter-spacing:.7px}
    </style>
  </defs>
  <rect class="bg" width="1100" height="360" rx="18"/>
  <text class="title" x="36" y="42">Two outbound paths. Two different boundaries.</text>
  <rect class="box" x="36" y="113" width="190" height="126" rx="14"/>
  <text class="label" x="131" y="160" text-anchor="middle">CLI agent</text>
  <text class="small" x="131" y="188" text-anchor="middle">internal network</text>
  <text class="small" x="131" y="211" text-anchor="middle">no direct gateway</text>
  <rect class="box" x="340" y="75" width="220" height="94" rx="14" style="stroke:#42a5f5"/>
  <text class="label" x="450" y="111" text-anchor="middle">Squid proxy</text>
  <text class="small" x="450" y="138" text-anchor="middle">hostname allowlist · HTTPS</text>
  <rect class="box" x="340" y="207" width="220" height="94" rx="14" style="stroke:#a78bfa"/>
  <text class="label" x="450" y="243" text-anchor="middle">Ollama API proxy</text>
  <text class="small" x="450" y="270" text-anchor="middle">injects real key · limits requests</text>
  <rect class="dest" x="735" y="75" width="320" height="94" rx="14"/>
  <text class="label" x="895" y="112" text-anchor="middle">Allowed web / tool hosts</text>
  <text class="small" x="895" y="140" text-anchor="middle">TLS stays encrypted</text>
  <rect class="dest" x="735" y="207" width="320" height="94" rx="14"/>
  <text class="label" x="895" y="243" text-anchor="middle">Ollama API</text>
  <text class="small" x="895" y="270" text-anchor="middle">agent sees placeholder key</text>
  <path class="toolLine" d="M226 145H285V122H332"/><path class="toolLine" d="M560 122H727"/>
  <path class="modelLine" d="M226 207H285V254H332"/><path class="modelLine" d="M560 254H727"/>
  <path class="blocked" d="M226 239H265V315H690V305"/>
  <circle cx="265" cy="239" r="12" fill="#101923" stroke="#ef6a6a" stroke-width="3"/><path d="M259 233l12 12m0-12l-12 12" stroke="#ef6a6a" stroke-width="3"/>
  <text class="badge" x="490" y="345" text-anchor="middle" fill="#ff9b9b">DIRECT EGRESS BLOCKED</text>
</svg>
