<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Entra Agent ID object model</title>
  <desc id="desc">A blueprint application creates one or many (1:N) tenant-local agent identities through a blueprint principal. Each agent identity may have one optional paired agent user. Owners and sponsors provide technical and business accountability. Permissions can be inherited from the blueprint or assigned directly to the agent identity and agent user.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131d31"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#183e72"/><stop offset="1" stop-color="#142a4c"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#164d55"/><stop offset="1" stop-color="#15343d"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#49316d"/><stop offset="1" stop-color="#30254d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#74a9ff"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#57d4c4"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#c2a3ff"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eef4ff}.muted{fill:#a9b8ce}.small{font-size:17px}.body{font-size:20px}.heading{font-size:26px;font-weight:700}.card{filter:url(#shadow);stroke-width:1.5}.label{font-size:15px;font-weight:700;letter-spacing:1.3px}.mono{font-family:Consolas,monospace;font-size:16px;fill:#d2e4ff}
    </style>
  </defs>
  <rect width="1600" height="1040" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" font-size="18" font-weight="700" letter-spacing="2" fill="#81aef5">MICROSOFT ENTRA AGENT ID</text>
  <text x="72" y="126" font-size="42" font-weight="750">One blueprint, tenant-local agent identities</text>
  <text x="72" y="164" font-size="21" class="muted">The object IDs and permissions differ by layer. Map the relationships before auditing access.</text>

  <!-- Blueprint -->
  <g class="card">
    <rect x="72" y="228" width="390" height="260" rx="20" fill="url(#blue)" stroke="#4c83d7"/>
    <text x="104" y="270" class="label" fill="#a7c8ff">APPLICATION OBJECT · DEFINITION</text>
    <text x="104" y="316" class="heading">Agent identity blueprint</text>
    <text x="104" y="355" class="body muted">Defines an agent type and its</text>
    <text x="104" y="384" class="body muted">authentication foundation.</text>
    <rect x="104" y="414" width="324" height="46" rx="10" fill="#0d1c33" opacity=".68"/>
    <text x="120" y="443" class="mono">application · agentIdentityBlueprint</text>
  </g>
  <text x="267" y="519" class="small muted" text-anchor="middle">Credentials · declared permissions · settings</text>

  <!-- Tenant boundary -->
  <rect x="550" y="205" width="980" height="548" rx="24" fill="#101a2b" stroke="#34445d" stroke-width="2" stroke-dasharray="9 9"/>
  <rect x="582" y="184" width="290" height="42" rx="21" fill="#202d42" stroke="#40536f"/>
  <text x="727" y="212" text-anchor="middle" class="label" fill="#c5d2e4">CUSTOMER / RESOURCE TENANT</text>

  <!-- principal -->
  <g class="card">
    <rect x="620" y="260" width="340" height="170" rx="18" fill="#1b2940" stroke="#6d88aa"/>
    <text x="650" y="298" class="label" fill="#bdd5f4">TENANT-LOCAL PRESENCE</text>
    <text x="650" y="338" font-size="23" font-weight="700">Blueprint principal</text>
    <text x="650" y="372" class="small muted">Records the blueprint in this tenant;</text>
    <text x="650" y="397" class="small muted">appears in token and audit activity.</text>
  </g>

  <!-- agent identity (stacked outlines show 1:N instances) -->
  <rect x="1109" y="231" width="380" height="220" rx="18" fill="#12303a" stroke="#2f7f78" stroke-width="1.5" opacity=".55"/>
  <rect x="1097" y="243" width="380" height="220" rx="18" fill="#143e47" stroke="#38a198" stroke-width="1.5" opacity=".8"/>
  <g class="card">
    <rect x="1085" y="255" width="380" height="220" rx="18" fill="url(#teal)" stroke="#45b9ad"/>
    <text x="1117" y="294" class="label" fill="#9af1e5">ONE AGENT INSTANCE</text>
    <text x="1117" y="336" class="heading">Agent identity</text>
    <text x="1117" y="373" class="body muted">Primary identity used by the agent.</text>
    <text x="1117" y="403" class="small muted">Uses blueprint credentials; has its own</text>
    <text x="1117" y="427" class="small muted">ID, status, sponsor, and direct access.</text>
    <text x="1117" y="456" class="mono">servicePrincipal · agentIdentity</text>
  </g>

  <!-- agent user -->
  <g class="card">
    <rect x="1085" y="542" width="380" height="164" rx="18" fill="url(#purple)" stroke="#a88ae8"/>
    <text x="1117" y="579" class="label" fill="#d8c7ff">OPTIONAL · ZERO OR ONE</text>
    <text x="1117" y="618" class="heading">Agent user</text>
    <text x="1117" y="650" class="small muted">Paired user object for user-based resources,</text>
    <text x="1117" y="676" class="small muted">groups, licenses, or workload roles.</text>
  </g>

  <!-- relationship arrows -->
  <path d="M462 333 C515 333 550 333 608 333" fill="none" stroke="#74a9ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="535" y="309" text-anchor="middle" class="small" fill="#a7c8ff">added to tenant</text>
  <path d="M960 345 C1004 345 1032 345 1072 345" fill="none" stroke="#57d4c4" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <text x="1016" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#8be5d8">1 : N</text>
  <text x="1016" y="322" text-anchor="middle" class="small" fill="#8be5d8">creates instances</text>
  <path d="M1275 475 L1275 530" fill="none" stroke="#c2a3ff" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="1302" y="512" class="small" fill="#d8c7ff">optional 1:1 pair</text>

  <!-- multitenant extension -->
  <rect x="72" y="568" width="390" height="137" rx="18" fill="#172235" stroke="#455975" stroke-width="1.5"/>
  <text x="102" y="606" class="label" fill="#c6d7ed">MULTITENANT PUBLISHING</text>
  <text x="102" y="642" class="small muted">A blueprint can be represented by a</text>
  <text x="102" y="668" class="small muted">principal in each customer tenant.</text>
  <text x="102" y="692" class="small muted">Agent identity IDs stay tenant-local.</text>
  <path d="M270 488 C270 530 270 548 270 558" fill="none" stroke="#74a9ff" stroke-width="2.5" stroke-dasharray="7 7"/>

  <!-- permission bands -->
  <rect x="72" y="790" width="1458" height="150" rx="20" fill="#111d2e" stroke="#34445d"/>
  <text x="104" y="830" class="label" fill="#c5d2e4">ACCESS AND GOVERNANCE ARE SEPARATE CHECKS</text>
  <line x1="540" y1="850" x2="540" y2="914" stroke="#35465e"/>
  <line x1="1035" y1="850" x2="1035" y2="914" stroke="#35465e"/>
  <text x="104" y="872" class="body" font-weight="700">Blueprint</text>
  <text x="104" y="904" class="small muted">Shared baseline / inherited grants</text>
  <text x="575" y="872" class="body" font-weight="700">Agent identity</text>
  <text x="575" y="904" class="small muted">Direct Graph, Entra, and Azure access</text>
  <text x="1070" y="872" class="body" font-weight="700">Agent user</text>
  <text x="1070" y="904" class="small muted">User groups, licenses, Defender URBAC*</text>
  <text x="72" y="982" class="small muted">Owners operate configuration. Sponsors own business accountability. Managers apply to the agent user relationship.</text>
  <text x="1528" y="982" text-anchor="end" class="small muted">*Audit the principal where the role is assigned.</text>
  <text x="72" y="1018" font-size="15" class="muted">AI generated illustration.</text>
</svg>
